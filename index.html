<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Music Box - Русские хиты</title>
    <meta name="theme-color" content="#1db954">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #1db954;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --card-color: #282828;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .player {
            background: var(--surface-color);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player__header {
            text-align: center;
            margin-bottom: 20px;
        }

        .player__title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #1db954, #1ed760);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .player__subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-color);
            padding: 4px;
            border-radius: 50px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .tab.active {
            background: var(--primary-color);
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .category-section {
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-btn {
            background: var(--card-color);
            border: none;
            color: var(--text-primary);
            padding: 16px 8px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
        }

        .category-btn:hover {
            background: var(--primary-color);
            transform: scale(1.02);
        }

        .category-btn.selected {
            background: var(--primary-color);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.5);
        }

        .category-emoji {
            font-size: 24px;
        }

        .category-years {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .year-btn {
            background: var(--card-color);
            border: none;
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            min-width: 70px;
        }

        .year-btn:hover {
            background: var(--primary-color);
        }

        .year-btn.selected {
            background: var(--primary-color);
        }

        .load-music-btn {
            background: linear-gradient(135deg, var(--primary-color), #1ed760);
            border: none;
            color: white;
            padding: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin: 16px 0;
            transition: all 0.3s;
        }

        .load-music-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
        }

        .load-music-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 2px dashed var(--primary-color);
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--primary-color), #1ed760);
            color: white;
            padding: 16px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            justify-content: center;
            font-size: 16px;
        }

        .upload-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
        }

        .hidden-input {
            display: none;
        }

        .upload-progress {
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 24px;
            background: var(--card-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #1ed760);
            color: white;
            font-size: 12px;
            line-height: 24px;
            text-align: center;
            transition: width 0.3s;
            white-space: nowrap;
            overflow: hidden;
        }

        .player__cover {
            width: 180px;
            height: 180px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(29, 185, 84, 0.3);
        }

        .player__cover-icon {
            font-size: 64px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .player__info {
            text-align: center;
            margin-bottom: 20px;
        }

        .player__track-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .player__track-artist {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .player__progress {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: var(--card-color);
            border-radius: 10px;
            outline: none;
            margin-bottom: 8px;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(29, 185, 84, 0.6);
        }

        .player__time {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .player__controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .play-pause {
            background: var(--primary-color);
            width: 64px;
            height: 64px;
            font-size: 32px;
        }

        .play-pause:hover {
            background: #1ed760;
            transform: scale(1.05);
        }

        .player__extra-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--card-color);
            border-radius: 40px;
        }

        .extra-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 12px;
            flex: 1;
        }

        .extra-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .extra-icon {
            font-size: 20px;
        }

        .player__playlist {
            border-top: 1px solid var(--card-color);
            padding-top: 16px;
        }

        .playlist-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-count {
            background: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .playlist {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 8px;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }

        .playlist::-webkit-scrollbar-track {
            background: var(--card-color);
            border-radius: 10px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }

        .playlist-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            background: var(--card-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-item:hover {
            background: #3e3e3e;
            color: var(--text-primary);
        }

        .playlist-item.active {
            background: var(--primary-color);
            color: white;
        }

        .playlist-empty {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 20px !important;
            background: transparent !important;
            justify-content: center;
        }

        .delete-btn {
            color: #ff4444;
            font-size: 18px;
            padding: 0 8px;
            cursor: pointer;
            opacity: 0.7;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .stats {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--card-color);
        }

        @media (max-width: 480px) {
            .container { padding: 4px; }
            .player { padding: 16px; }
            .player__cover { width: 150px; height: 150px; }
            .category-grid { grid-template-columns: 1fr; }
            .category-years { gap: 4px; }
            .year-btn { min-width: 60px; padding: 10px; }
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            padding: 10px;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 8px;
            margin: 10px 0;
        }

        .info-message {
            color: #1db954;
            text-align: center;
            padding: 10px;
            background: rgba(29, 185, 84, 0.1);
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player">
            <div class="player__header">
                <h1 class="player__title">🎧 Music Box</h1>
                <p class="player__subtitle">Русские хиты 2015-2024</p>
            </div>
            
            <!-- Вкладки -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('local')">📱 Моя музыка</div>
                <div class="tab" onclick="switchTab('rus')">🇷🇺 Русские хиты</div>
            </div>
            
            <!-- Секция с локальной музыкой -->
            <div id="localSection" class="section active">
                <div class="upload-section">
                    <label for="musicUpload" class="upload-btn">
                        <span class="upload-icon">📁</span>
                        <span>Выбрать музыку с телефона</span>
                    </label>
                    <input type="file" id="musicUpload" accept="audio/*" multiple class="hidden-input">
                    <p class="upload-hint">MP3, M4A, OGG, WAV (до 1000+ треков)</p>
                </div>
            </div>
            
            <!-- Секция с русскими хитами -->
            <div id="rusSection" class="section">
                <div class="category-section">
                    <div class="category-title">
                        <span>📅 Год</span>
                    </div>
                    
                    <!-- Года -->
                    <div class="category-years" id="yearButtons"></div>
                    
                    <div class="category-title" style="margin-top: 16px;">
                        <span>🎵 Категория</span>
                    </div>
                    
                    <!-- Категории -->
                    <div class="category-grid" id="categoryButtons"></div>
                    
                    <button class="load-music-btn" onclick="loadRussianHits()" id="loadHitsBtn">
                        🇷🇺 Загрузить русские хиты
                    </button>
                    
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </div>
            </div>
            
            <!-- Прогресс загрузки -->
            <div class="upload-progress" id="uploadProgress" style="display: none;">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill">0%</div>
                </div>
            </div>
            
            <!-- Плеер -->
            <div class="player__cover">
                <div class="player__cover-icon" id="coverEmoji">🎵</div>
            </div>
            
            <div class="player__info">
                <h2 class="player__track-name" id="trackName">Выбери год и категорию</h2>
                <p class="player__track-artist" id="trackArtist">Нажми "Загрузить русские хиты"</p>
            </div>
            
            <audio id="audioPlayer" preload="metadata"></audio>
            
            <div class="player__progress">
                <input type="range" id="progressBar" value="0" class="progress-bar">
                <div class="player__time">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="player__controls">
                <button class="control-btn" onclick="playPrevious()">⏮</button>
                <button class="control-btn play-pause" onclick="togglePlay()">
                    <span class="control-icon" id="playIcon">▶</span>
                </button>
                <button class="control-btn" onclick="playNext()">⏭</button>
            </div>
            
            <div class="player__extra-controls">
                <button class="extra-btn" onclick="playRandom()">
                    <span class="extra-icon">🎲</span>
                    <span>Рандом</span>
                </button>
                <button class="extra-btn" onclick="downloadCurrent()">
                    <span class="extra-icon">⬇️</span>
                    <span>Скачать</span>
                </button>
                <button class="extra-btn" onclick="clearPlaylist()">
                    <span class="extra-icon">🗑️</span>
                    <span>Очистить</span>
                </button>
            </div>
            
            <!-- Плейлист -->
            <div class="player__playlist">
                <div class="playlist-title">
                    <span>📋 Твои треки</span>
                    <span class="playlist-count" id="trackCount">0</span>
                </div>
                <ul class="playlist" id="playlistContainer">
                    <li class="playlist-item playlist-empty">Загрузи музыку</li>
                </ul>
            </div>
            
            <div class="stats" id="stats">🎵 Нет треков</div>
        </div>
    </div>

                    { name: 'Плакала', artist: 'Zivert' },
                    { name: 'Пыял', artist: 'Scirena' },
                    { name: 'Моя голова винтом', artist: 'kostromin' },
                    { name: 'Кукла', artist: 'Дайте танк (!)' }
                ],
                '2023': [
                    { name: 'Повело', artist: 'INSTASAMKA' },
                    { name: 'Моя голова винтом', artist: 'kostromin' },
                    { name: 'Забирай', artist: 'Xolidayboy' }
                ],
                '2022': [
                    { name: 'Мокрые', artist: 'RSAC' },
                    { name: 'Камин', artist: 'Konfuz' }
                ],
                '2021': [
                    { name: 'Розовое вино', artist: 'Элджей & Feduk' },
                    { name: 'Пополам', artist: 'MACAN' }
                ],
                '2020': [
                    { name: 'Юность', artist: 'Dabro' },
                    { name: 'Кислород', artist: 'Artik & Asti' }
                ]
            }
        };

        // Заполняем недостающие года
        for (let year of years) {
            for (let category of ['pop', 'rap', 'rock', 'dance', 'chanson', 'hits']) {
                if (!russianHits[category][year]) {
                    // Копируем из 2024 если нет данных
                    russianHits[category][year] = [...russianHits[category]['2024']].slice(0, 4);
                }
            }
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            setupAudioListeners();
            setupUploadListener();
            registerServiceWorker();
            renderYearButtons();
            renderCategoryButtons();
            loadPlaylistFromStorage();
        });

        // Рендер кнопок годов
        function renderYearButtons() {
            const container = document.getElementById('yearButtons');
            container.innerHTML = '';
            
            years.forEach(year => {
                const btn = document.createElement('button');
                btn.className = `year-btn ${year === selectedYear ? 'selected' : ''}`;
                btn.textContent = year;
                btn.onclick = () => {
                    selectedYear = year;
                    document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                container.appendChild(btn);
            });
        }

        // Рендер кнопок категорий
        function renderCategoryButtons() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat.id === selectedCategory ? 'selected' : ''}`;
                btn.innerHTML = `
                    <span class="category-emoji">${cat.emoji}</span>
                    <span class="category-name">${cat.name}</span>
                `;
                btn.onclick = () => {
                    selectedCategory = cat.id;
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                container.appendChild(btn);
            });
        }

        // Загрузка русских хитов
        async function loadRussianHits() {
            const btn = document.getElementById('loadHitsBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Загрузка...';
            
            errorMessage.style.display = 'none';
            uploadProgress.style.display = 'block';
            progressFill.style.width = '0%';
            progressFill.textContent = '0%';
            
            try {
                // Получаем треки для выбранного года и категории
                const tracks = russianHits[selectedCategory][selectedYear] || russianHits[selectedCategory]['2024'];
                
                if (!tracks || tracks.length === 0) {
                    throw new Error('Нет треков для выбранной категории');
                }
                
                let loaded = 0;
                for (const trackData of tracks) {
                    try {
                        // Создаем тестовый аудио-тон (для локальной работы)
                        const sampleRate = 8000;
                        const seconds = 5;
                        const frequency = 440 + (loaded * 100);
                        
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const buffer = audioContext.createBuffer(1, sampleRate * seconds, sampleRate);
                        const data = buffer.getChannelData(0);
                        
                        for (let i = 0; i < data.length; i++) {
                            data[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * 0.5;
                        }
                        
                        const wavData = audioBufferToWav(buffer);
                        const blob = new Blob([wavData], { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        
                        const track = {
                            id: 'rus_' + Date.now() + '_' + loaded,
                            name: trackData.name,
                            artist: trackData.artist + ` (${selectedYear})`,
                            file: url,
                            size: blob.size,
                            type: 'audio/wav',
                            duration: seconds,
                            added: new Date().toLocaleString(),
                            category: selectedCategory,
                            year: selectedYear
                        };
                        
                        playlist.push(track);
                        
                        loaded++;
                        const percent = Math.round((loaded / tracks.length) * 100);
                        progressFill.style.width = percent + '%';
                        progressFill.textContent = percent + '%';
                        
                        await new Promise(r => setTimeout(r, 100));
                        
                    } catch (e) {
                        console.error('Ошибка создания трека:', e);
                    }
                }
                
                if (loaded === 0) {
                    throw new Error('Не удалось создать треки');
                }
                
                savePlaylist();
                updatePlaylistUI();
                updateStats();
                
                if (playlist.length > 0) {
                    playTrack(playlist.length - loaded);
                }
                
                progressFill.style.width = '100%';
                progressFill.textContent = 'Готово!';
                
                setTimeout(() => {
                    uploadProgress.style.display = 'none';
                }, 1000);
                
            } catch (error) {
                console.error('Ошибка:', error);
                errorMessage.textContent = 'Ошибка: ' + error.message;
                errorMessage.style.display = 'block';
                uploadProgress.style.display = 'none';
            }
            
            btn.disabled = false;
            btn.innerHTML = '🇷🇺 Загрузить русские хиты';
        }

        // Конвертер AudioBuffer в WAV
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            
            const data = buffer.getChannelData(0);
            const samples = new Int16Array(data.length);
            
            for (let i = 0; i < data.length; i++) {
                const s = Math.max(-1, Math.min(1, data[i]));
                samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            
            const dataSize = samples.length * bytesPerSample;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;
            
            const arrayBuffer = new ArrayBuffer(totalSize);
            const view = new DataView(arrayBuffer);
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, totalSize - 8, true);
            writeString(view, 8, 'WAVE');
            
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);
            
            const offset = 44;
            for (let i = 0; i < samples.length; i++) {
                view.setInt16(offset + i * 2, samples[i], true);
            }
            
            return arrayBuffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Сохранение плейлиста
        function savePlaylist() {
            try {
                const tracksToSave = playlist.map(track => ({
                    id: track.id,
                    name: track.name,
                    artist: track.artist,
                    size: track.size,
                    type: track.type,
                    added: track.added,
                    category: track.category,
                    year: track.year
                }));
                localStorage.setItem('musicPlaylist', JSON.stringify(tracksToSave));
            } catch (e) {
                console.error('Ошибка сохранения:', e);
            }
        }

        // Загрузка из хранилища
        function loadPlaylistFromStorage() {
            try {
                const saved = localStorage.getItem('musicPlaylist');
                if (saved) {
                    const tracks = JSON.parse(saved);
                    if (tracks.length > 0) {
                        playlistContainer.innerHTML = '<li class="playlist-item playlist-empty">🔄 Треки сохранены, создайте новый плейлист</li>';
                        trackCount.textContent = tracks.length;
                        stats.innerHTML = `📋 ${tracks.length} треков в сохраненном плейлисте`;
                    }
                }
            } catch (e) {
                console.log('Нет сохраненных треков');
            }
        }

        // Обработка загруженных файлов
        function setupUploadListener() {
            uploadInput.addEventListener('change', function(event) {
                const files = Array.from(event.target.files);
                
                if (files.length === 0) return;
                
                uploadProgress.style.display = 'block';
                let processed = 0;
                
                files.forEach(file => {
                    if (file.type.startsWith('audio/')) {
                        const url = URL.createObjectURL(file);
                        const trackId = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        
                        playlist.push({
                            id: trackId,
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            artist: 'Моя музыка',
                            file: url,
                            size: file.size,
                            type: file.type,
                            added: new Date().toLocaleString()
                        });
                    }
                    
                    processed++;
                    const percent = Math.round((processed / files.length) * 100);
                    progressFill.style.width = percent + '%';
                    progressFill.textContent = percent + '%';
                });
                
                savePlaylist();
                updatePlaylistUI();
                updateStats();
                
                if (playlist.length > 0) {
                    playTrack(playlist.length - files.length);
                }
                
                setTimeout(() => {
                    uploadProgress.style.display = 'none';
                }, 1000);
                
                uploadInput.value = '';
            });
        }

        // Переключение вкладок
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            if (tab === 'local') {
                document.querySelector('.tab').classList.add('active');
                document.getElementById('localSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('rusSection').classList.add('active');
            }
        }

        // Воспроизведение трека
        function playTrack(index) {
            if (playlist.length === 0 || index < 0 || index >= playlist.length) return;
            
            currentTrackIndex = index;
            const track = playlist[index];
            
            audio.src = track.file;
            trackName.textContent = track.name;
            trackArtist.textContent = track.artist;
            
            const emojis = ['🎵', '🎶', '🎸', '🎹', '🎷', '🎺', '🎻', '🥁', '🎤'];
            coverEmoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            updatePlaylistUI();
            
            audio.play().catch(e => console.log('Автовоспроизведение не удалось:', e));
        }

        // Переключение воспроизведения
        function togglePlay() {
            if (playlist.length === 0) {
                errorMessage.textContent = 'Сначала загрузи музыку!';
                errorMessage.style.display = 'block';
                setTimeout(() => errorMessage.style.display = 'none', 3000);
                return;
            }
            
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // Следующий трек
        function playNext() {
            if (playlist.length === 0) return;
            let nextIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(nextIndex);
        }

        // Предыдущий трек
        function playPrevious() {
            if (playlist.length === 0) return;
            let prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(prevIndex);
        }

        // Случайный трек
        function playRandom() {
            if (playlist.length === 0) return;
            let randomIndex = Math.floor(Math.random() * playlist.length);
            playTrack(randomIndex);
        }

        // Скачивание трека
        function downloadCurrent() {
            if (playlist.length > 0 && playlist[currentTrackIndex]) {
                const track = playlist[currentTrackIndex];
                const link = document.createElement('a');
                link.href = track.file;
                link.download = `${track.artist} - ${track.name}.wav`;
                link.click();
            }
        }

        // Очистка плейлиста
        function clearPlaylist() {
            if (playlist.length > 0 && confirm('Удалить все треки?')) {
                playlist = [];
                currentTrackIndex = 0;
                audio.src = '';
                trackName.textContent = 'Нет треков';
                trackArtist.textContent = 'Загрузи музыку';
                coverEmoji.textContent = '🎵';
                localStorage.removeItem('musicPlaylist');
                updatePlaylistUI();
                updateStats();
            }
        }

        // Обновление плейлиста
        function updatePlaylistUI() {
            if (playlist.length === 0) {
                playlistContainer.innerHTML = '<li class="playlist-item playlist-empty">Нет треков</li>';
                trackCount.textContent = '0';
                return;
            }
            
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
                
                const textSpan = document.createElement('span');
                textSpan.textContent = `${track.artist} - ${track.name}`;
                
                const deleteBtn = document.createElement('span');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeTrack(index);
                };
                
                li.appendChild(textSpan);
                li.appendChild(deleteBtn);
                li.onclick = () => playTrack(index);
                
                playlistContainer.appendChild(li);
            });
            
            trackCount.textContent = playlist.length;
        }

        // Удаление трека
        function removeTrack(index) {
            playlist.splice(index, 1);
            if (index === currentTrackIndex) {
                if (playlist.length > 0) {
                    playTrack(Math.min(index, playlist.length - 1));
                } else {
                    audio.src = '';
                    trackName.textContent = 'Нет треков';
                    trackArtist.textContent = 'Загрузи музыку';
                }
            } else if (index < currentTrackIndex) {
                currentTrackIndex--;
            }
            savePlaylist();
            updatePlaylistUI();
            updateStats();
        }

        // Обновление статистики
        function updateStats() {
            if (playlist.length > 0) {
                const totalSize = playlist.reduce((acc, track) => acc + (track.size || 0), 0);
                stats.innerHTML = `🎵 ${playlist.length} треков • 💾 ${formatBytes(totalSize)}`;
            } else {
                stats.innerHTML = '🎵 Нет треков';
            }
        }

        // Форматирование размера
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Б';
            const k = 1024;
            const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Настройка аудио
        function setupAudioListeners() {
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateDuration);
            audio.addEventListener('ended', playNext);
            audio.addEventListener('play', () => playIcon.textContent = '⏸');
            audio.addEventListener('pause', () => playIcon.textContent = '▶');
            
            progressBar.addEventListener('input', function() {
                if (audio.duration) {
                    audio.currentTime = (this.value / 100) * audio.duration;
                }
            });
        }

        // Обновление прогресса
        function updateProgress() {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                durationSpan.textContent = formatTime(audio.duration);
            }
        }

        // Обновление длительности
        function updateDuration() {
            if (audio.duration) {
                durationSpan.textContent = formatTime(audio.duration);
            }
        }

        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Service Worker для фона
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }
        }
    </script>
