<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Music Box - Офлайн плеер</title>
    <meta name="theme-color" content="#1db954">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #1db954;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --card-color: #282828;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .player {
            background: var(--surface-color);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player__header {
            text-align: center;
            margin-bottom: 20px;
        }

        .player__title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #1db954, #1ed760);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .player__subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .offline-badge {
            display: inline-block;
            background: #ff6b35;
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            -webkit-text-fill-color: white;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .upload-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 2px dashed var(--primary-color);
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--primary-color), #1ed760);
            color: white;
            padding: 16px 24px;
            border-radius: 50px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
            width: 100%;
            justify-content: center;
            font-size: 16px;
        }

        .upload-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.5);
        }

        .upload-icon {
            font-size: 24px;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 8px;
        }

        .hidden-input {
            display: none;
        }

        .upload-progress {
            margin-bottom: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 24px;
            background: var(--card-color);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #1ed760);
            color: white;
            font-size: 12px;
            line-height: 24px;
            text-align: center;
            transition: width 0.3s;
            border-radius: 12px;
            white-space: nowrap;
            overflow: hidden;
        }

        .player__cover {
            width: 180px;
            height: 180px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #1db954, #1ed760);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(29, 185, 84, 0.3);
        }

        .player__cover-icon {
            font-size: 64px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s;
        }

        .player__info {
            text-align: center;
            margin-bottom: 20px;
        }

        .player__track-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .player__track-artist {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .player__progress {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: var(--card-color);
            border-radius: 10px;
            outline: none;
            margin-bottom: 8px;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 2px 8px rgba(29, 185, 84, 0.6);
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .player__time {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .player__controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .play-pause {
            background: var(--primary-color);
            width: 64px;
            height: 64px;
            font-size: 32px;
        }

        .play-pause:hover {
            background: #1ed760;
            transform: scale(1.05);
        }

        .player__extra-controls {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--card-color);
            border-radius: 40px;
        }

        .extra-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
            transition: all 0.2s;
            font-size: 12px;
            flex: 1;
        }

        .extra-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .extra-icon {
            font-size: 20px;
        }

        .player__playlist {
            border-top: 1px solid var(--card-color);
            padding-top: 16px;
        }

        .playlist-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 400;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-count {
            background: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .playlist {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--card-color);
            border-radius: 8px;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }

        .playlist::-webkit-scrollbar-track {
            background: var(--card-color);
            border-radius: 10px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }

        .playlist-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            background: var(--card-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .playlist-item:hover {
            background: #3e3e3e;
            color: var(--text-primary);
        }

        .playlist-item.active {
            background: var(--primary-color);
            color: white;
            font-weight: 500;
        }

        .playlist-item.active .delete-btn {
            color: white;
        }

        .playlist-empty {
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 20px !important;
            background: transparent !important;
            justify-content: center;
        }

        .delete-btn {
            color: #ff4444;
            font-size: 18px;
            padding: 0 8px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .stats {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--card-color);
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .storage-info {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 4px;
            }
            
            .player {
                padding: 16px;
            }
            
            .player__cover {
                width: 150px;
                height: 150px;
            }
            
            .extra-btn {
                padding: 6px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player">
            <div class="player__header">
                <h1 class="player__title">🎧 Music Box</h1>
                <p class="player__subtitle">Загружай и слушай в фоне</p>
                <div id="offlineBadgeContainer"></div>
            </div>
            
            <!-- Кнопка загрузки музыки -->
            <div class="upload-section">
                <label for="musicUpload" class="upload-btn">
                    <span class="upload-icon">📁</span>
                    <span>Выбрать музыку с телефона</span>
                </label>
                <input type="file" id="musicUpload" accept="audio/*" multiple class="hidden-input">
                <p class="upload-hint">Можно выбрать 100+ треков (MP3, M4A, OGG, WAV)</p>
            </div>
            
            <!-- Прогресс загрузки -->
            <div class="upload-progress" id="uploadProgress" style="display: none;">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill">0%</div>
                </div>
                <div class="storage-info" id="storageInfo"></div>
            </div>
            
            <div class="player__cover" id="coverPlaceholder">
                <div class="player__cover-icon" id="coverEmoji">🎵</div>
            </div>
            
            <div class="player__info">
                <h2 class="player__track-name" id="trackName">Загрузка плейлиста...</h2>
                <p class="player__track-artist" id="trackArtist">Пожалуйста, подождите</p>
            </div>
            
            <audio id="audioPlayer" preload="metadata"></audio>
            
            <div class="player__progress">
                <input type="range" id="progressBar" value="0" class="progress-bar">
                <div class="player__time">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="player__controls">
                <button class="control-btn" onclick="playPrevious()" id="prevBtn">
                    <span class="control-icon">⏮</span>
                </button>
                <button class="control-btn play-pause" onclick="togglePlay()" id="playPauseBtn">
                    <span class="control-icon" id="playIcon">▶</span>
                </button>
                <button class="control-btn" onclick="playNext()" id="nextBtn">
                    <span class="control-icon">⏭</span>
                </button>
            </div>
            
            <div class="player__extra-controls">
                <button class="extra-btn" onclick="playRandom()" title="Случайный трек">
                    <span class="extra-icon">🎲</span>
                    <span>Рандом</span>
                </button>
                <button class="extra-btn" onclick="downloadCurrent()" title="Скачать текущий трек">
                    <span class="extra-icon">⬇️</span>
                    <span>Скачать</span>
                </button>
                <button class="extra-btn" onclick="clearPlaylist()" title="Очистить плейлист">
                    <span class="extra-icon">🗑️</span>
                    <span>Очистить</span>
                </button>
            </div>
            
            <div class="player__playlist">
                <div class="playlist-title">
                    <span>📋 Твои треки</span>
                    <span class="playlist-count" id="trackCount">0</span>
                </div>
                <ul class="playlist" id="playlistContainer">
                    <li class="playlist-item playlist-empty">Загрузка сохраненной музыки...</li>
                </ul>
            </div>
            
            <!-- Статистика -->
            <div class="stats" id="stats">🎵 Загрузка...</div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let playlist = [];
        let currentTrackIndex = 0;
        let isPlaying = false;
        let audio = document.getElementById('audioPlayer');
        let progressBar = document.getElementById('progressBar');
        let playPauseBtn = document.getElementById('playPauseBtn');
        let playIcon = document.getElementById('playIcon');
        let trackName = document.getElementById('trackName');
        let trackArtist = document.getElementById('trackArtist');
        let currentTimeSpan = document.getElementById('currentTime');
        let durationSpan = document.getElementById('duration');
        let playlistContainer = document.getElementById('playlistContainer');
        let coverEmoji = document.getElementById('coverEmoji');
        let uploadInput = document.getElementById('musicUpload');
        let stats = document.getElementById('stats');
        let trackCount = document.getElementById('trackCount');
        let uploadProgress = document.getElementById('uploadProgress');
        let progressFill = document.getElementById('progressFill');
        let storageInfo = document.getElementById('storageInfo');

        // Название базы данных
        const DB_NAME = 'MusicBoxDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'tracks';

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            checkOfflineStatus();
            initDatabase().then(() => {
                setupAudioListeners();
                setupUploadListener();
                loadPlaylistFromDB();
            });
        });

        // Проверка офлайн-статуса
        function checkOfflineStatus() {
            const badgeContainer = document.getElementById('offlineBadgeContainer');
            
            function updateBadge() {
                if (!navigator.onLine) {
                    badgeContainer.innerHTML = '<span class="offline-badge">📡 ОФЛАЙН</span>';
                } else {
                    badgeContainer.innerHTML = '';
                }
            }
            
            updateBadge();
            window.addEventListener('online', updateBadge);
            window.addEventListener('offline', updateBadge);
        }

        // Инициализация IndexedDB
        function initDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => {
                    console.error('Ошибка открытия БД');
                    reject();
                };
                
                request.onsuccess = (event) => {
                    window.db = event.target.result;
                    resolve();
                };
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        // Сохранение трека в БД
        function saveTrackToDB(track, fileBlob) {
            return new Promise((resolve, reject) => {
                const transaction = window.db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                
                const trackData = {
                    ...track,
                    blob: fileBlob,
                    file: null // Не сохраняем URL
                };
                
                const request = store.put(trackData);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject();
            });
        }

        // Загрузка всех треков из БД
        function loadPlaylistFromDB() {
            return new Promise((resolve, reject) => {
                if (!window.db) {
                    resolve();
                    return;
                }
                
                const transaction = window.db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                
                request.onsuccess = async (event) => {
                    const tracks = event.target.result;
                    
                    for (const track of tracks) {
                        if (track.blob) {
                            // Создаем URL из blob
                            const url = URL.createObjectURL(track.blob);
                            playlist.push({
                                ...track,
                                file: url,
                                blob: undefined // Убираем blob из памяти
                            });
                        }
                    }
                    
                    if (playlist.length > 0) {
                        // Перемешиваем
                        shufflePlaylist();
                        updatePlaylistUI();
                        updateStats();
                        
                        // Загружаем первый трек
                        playTrack(0);
                    } else {
                        playlistContainer.innerHTML = '<li class="playlist-item playlist-empty">Загрузи музыку с телефона</li>';
                        trackName.textContent = 'Нет загруженных треков';
                        trackArtist.textContent = 'Нажми кнопку выше';
                    }
                    
                    resolve();
                };
                
                request.onerror = () => resolve();
            });
        }

        // Удаление трека из БД
        function deleteTrackFromDB(trackId) {
            return new Promise((resolve, reject) => {
                const transaction = window.db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(trackId);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject();
            });
        }

        // Настройка загрузки файлов
        function setupUploadListener() {
            uploadInput.addEventListener('change', function(event) {
                const files = Array.from(event.target.files);
                processAudioFiles(files);
            });
        }

        // Обработка аудио файлов
        async function processAudioFiles(files) {
            const audioFiles = files.filter(file => file.type.startsWith('audio/'));
            
            if (audioFiles.length === 0) {
                alert('Выбери аудио файлы (MP3, M4A, OGG и т.д.)');
                return;
            }

            uploadProgress.style.display = 'block';
            let processed = 0;
            let totalSize = 0;

            for (const file of audioFiles) {
                try {
                    totalSize += file.size;
                    
                    // Получаем метаданные
                    const metadata = await getAudioMetadata(file);
                    
                    const trackId = 'track_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    
                    // Создаем URL для временного воспроизведения
                    const url = URL.createObjectURL(file);
                    
                    const track = {
                        id: trackId,
                        name: metadata.title || getFileNameWithoutExt(file.name),
                        artist: metadata.artist || 'Загружено с телефона',
                        file: url,
                        size: file.size,
                        type: file.type,
                        duration: metadata.duration || 0,
                        added: new Date().toLocaleString()
                    };
                    
                    // Пробуем разобрать имя файла если нет метаданных
                    if (track.name.includes(' - ') && track.artist === 'Загружено с телефона') {
                        const parts = track.name.split(' - ');
                        track.artist = parts[0].trim();
                        track.name = parts[1].trim();
                    }
                    
                    // Сохраняем в IndexedDB
                    await saveTrackToDB(track, file);
                    
                    playlist.push(track);
                    
                } catch (error) {
                    console.error('Ошибка обработки файла:', error);
                }
                
                processed++;
                const percent = Math.round((processed / audioFiles.length) * 100);
                progressFill.style.width = percent + '%';
                progressFill.textContent = percent + '%';
                
                storageInfo.textContent = `Обработано: ${processed}/${audioFiles.length} • ${formatBytes(totalSize)}`;
            }

            // Перемешиваем плейлист
            shufflePlaylist();
            
            // Обновляем интерфейс
            updatePlaylistUI();
            updateStats();
            
            uploadProgress.style.display = 'none';
            
            // Если это первый трек, начинаем играть
            if (playlist.length > 0) {
                playTrack(0);
            }
            
            // Очищаем input
            uploadInput.value = '';
        }

        // Получение метаданных аудио
        function getAudioMetadata(file) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(file);
                const tempAudio = new Audio();
                
                tempAudio.addEventListener('loadedmetadata', () => {
                    URL.revokeObjectURL(url);
                    
                    resolve({
                        title: getFileNameWithoutExt(file.name),
                        artist: 'Загружено с телефона',
                        duration: tempAudio.duration
                    });
                });
                
                tempAudio.addEventListener('error', () => {
                    URL.revokeObjectURL(url);
                    resolve({
                        title: getFileNameWithoutExt(file.name),
                        artist: 'Загружено с телефона',
                        duration: 0
                    });
                });
                
                tempAudio.src = url;
                tempAudio.load();
            });
        }

        // Получить имя файла без расширения
        function getFileNameWithoutExt(filename) {
            return filename.split('.').slice(0, -1).join('.') || filename;
        }

        // Перемешать плейлист
        function shufflePlaylist() {
            for (let i = playlist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
            }
        }

        // Обновление списка плейлиста
        function updatePlaylistUI() {
            if (playlist.length === 0) {
                playlistContainer.innerHTML = '<li class="playlist-item playlist-empty">Загрузи музыку с телефона</li>';
                trackCount.textContent = '0';
                return;
            }
            
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = 'playlist-item';
                if (index === currentTrackIndex) {
                    li.classList.add('active');
                }
                
                // Название трека
                const trackNameSpan = document.createElement('span');
                trackNameSpan.textContent = `${track.artist} - ${track.name}`;
                trackNameSpan.style.flex = '1';
                trackNameSpan.style.overflow = 'hidden';
                trackNameSpan.style.textOverflow = 'ellipsis';
                trackNameSpan.style.whiteSpace = 'nowrap';
                
                // Кнопка удаления
                const deleteBtn = document.createElement('span');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '🗑️';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeTrack(index);
                };
                
                li.appendChild(trackNameSpan);
                li.appendChild(deleteBtn);
                
                li.onclick = () => playTrack(index);
                
                playlistContainer.appendChild(li);
            });
            
            trackCount.textContent = playlist.length;
        }

        // Удалить трек
        async function removeTrack(index) {
            if (index >= 0 && index < playlist.length) {
                const track = playlist[index];
                
                // Освобождаем URL
                if (track.file && track.file.startsWith('blob:')) {
                    URL.revokeObjectURL(track.file);
                }
                
                // Удаляем из IndexedDB
                await deleteTrackFromDB(track.id);
                
                playlist.splice(index, 1);
                
                if (playlist.length === 0) {
                    currentTrackIndex = 0;
                    audio.src = '';
                    audio.pause();
                    trackName.textContent = 'Нет загруженных треков';
                    trackArtist.textContent = 'Нажми кнопку выше';
                    coverEmoji.textContent = '🎵';
                } else {
                    if (currentTrackIndex >= playlist.length) {
                        currentTrackIndex = playlist.length - 1;
                    }
                    if (currentTrackIndex === index) {
                        playTrack(currentTrackIndex);
                    } else if (index < currentTrackIndex) {
                        currentTrackIndex--;
                    }
                }
                
                updatePlaylistUI();
                updateStats();
            }
        }

        // Воспроизведение трека
        function playTrack(index) {
            if (playlist.length === 0 || index < 0 || index >= playlist.length) {
                return;
            }
            
            currentTrackIndex = index;
            const track = playlist[index];
            
            audio.src = track.file;
            trackName.textContent = track.name;
            trackArtist.textContent = track.artist;
            
            // Меняем эмодзи
            const emojis = ['🎵', '🎶', '🎸', '🎹', '🎷', '🎺', '🎻', '🥁', '🎤'];
            coverEmoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            updatePlaylistUI();
            
            audio.play().catch(e => {
                console.log('Нажми play чтобы начать');
            });
        }

        // Переключение воспроизведения
        function togglePlay() {
            if (playlist.length === 0) {
                alert('Сначала загрузи музыку!');
                return;
            }
            
            if (audio.src) {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            } else {
                playTrack(0);
            }
        }

        // Следующий трек
        function playNext() {
            if (playlist.length === 0) return;
            let nextIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(nextIndex);
        }

        // Предыдущий трек
        function playPrevious() {
            if (playlist.length === 0) return;
            let prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(prevIndex);
        }

        // Случайный трек
        function playRandom() {
            if (playlist.length === 0) return;
            let randomIndex = Math.floor(Math.random() * playlist.length);
            playTrack(randomIndex);
        }

        // Очистить плейлист
        async function clearPlaylist() {
            if (playlist.length > 0 && confirm('Удалить все треки из плейлиста?')) {
                // Освобождаем все URL
                playlist.forEach(track => {
                    if (track.file && track.file.startsWith('blob:')) {
                        URL.revokeObjectURL(track.file);
                    }
                });
                
                // Очищаем IndexedDB
                const transaction = window.db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.clear();
                
                playlist = [];
                currentTrackIndex = 0;
                audio.src = '';
                audio.pause();
                trackName.textContent = 'Нет загруженных треков';
                trackArtist.textContent = 'Нажми кнопку выше';
                coverEmoji.textContent = '🎵';
                
                updatePlaylistUI();
                updateStats();
            }
        }

        // Скачивание текущего трека
        function downloadCurrent() {
            if (playlist.length > 0 && playlist[currentTrackIndex]) {
                const track = playlist[currentTrackIndex];
                
                // Получаем blob из IndexedDB
                const transaction = window.db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(track.id);
                
                request.onsuccess = (event) => {
                    const trackData = event.target.result;
                    if (trackData && trackData.blob) {
                        const url = URL.createObjectURL(trackData.blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `${track.artist} - ${track.name}.mp3`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(url), 100);
                    }
                };
            }
        }

        // Обновление статистики
        function updateStats() {
            if (playlist.length > 0) {
                const totalSize = playlist.reduce((acc, track) => acc + track.size, 0);
                stats.innerHTML = `🎵 ${playlist.length} треков • 💾 ${formatBytes(totalSize)}`;
            } else {
                stats.innerHTML = '🎵 Нет загруженных треков';
            }
        }

        // Форматирование байтов
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Б';
            const k = 1024;
            const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Настройка аудио слушателей
        function setupAudioListeners() {
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateDuration);
            audio.addEventListener('ended', playNext);
            audio.addEventListener('play', () => {
                isPlaying = true;
                playIcon.textContent = '⏸';
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                playIcon.textContent = '▶';
            });
            audio.addEventListener('error', (e) => {
                console.error('Ошибка воспроизведения:', e);
                playNext();
            });
            
            progressBar.addEventListener('input', function() {
                if (audio.duration) {
                    const time = (this.value / 100) * audio.duration;
                    audio.currentTime = time;
                }
            });
        }

        // Обновление прогресса
        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                durationSpan.textContent = formatTime(audio.duration);
            }
        }

        // Обновление длительности
        function updateDuration() {
            if (audio.duration && isFinite(audio.duration)) {
                durationSpan.textContent = formatTime(audio.duration);
            }
        }

        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Регистрация Service Worker для офлайн-режима
        if ('serviceWorker' in navigator) {
            // Создаем отдельный скрипт для Service Worker
            const swScript = `
                const CACHE_NAME = 'music-box-v2';
                const urlsToCache = [
                    '/',
                    '/index.html'
                ];

                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => {
                                return cache.addAll(urlsToCache);
                            })
                    );
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => {
                                if (response) {
                                    return response;
                                }
                                return fetch(event.request);
                            })
                    );
                });

                self.addEventListener('activate', event => {
                    event.waitUntil(
                        caches.keys().then(cacheNames => {
                            return Promise.all(
                                cacheNames.map(cacheName => {
                                    if (cacheName !== CACHE_NAME) {
                                        return caches.delete(cacheName);
                                    }
                                })
                            );
                        })
                    );
                });
            `;

            // Создаем Blob и регистрируем
            const blob = new Blob([swScript], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('Service Worker зарегистрирован'))
                .catch(() => console.log('Service Worker не поддерживается'));
        }
    </script>
